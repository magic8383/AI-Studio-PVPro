<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Liquid-Glass Emerald & Midnight Teal Canvas -->
    <radialGradient id="liquidBg" cx="48%" cy="32%" r="72%" fx="48%" fy="25%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="38%" stop-color="#064e3b" />
      <stop offset="72%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#02181c" />
    </radialGradient>

    <!-- Specular Liquid Glass Rim Gradient -->
    <linearGradient id="glassRim" x1="80" y1="60" x2="944" y2="964" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#2dd4bf" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <!-- Top Specular Glass Refraction Highlight -->
    <linearGradient id="topGlassSheen" x1="512" y1="36" x2="512" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#ccfbf1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Emerald-Turquoise Core Glow -->
    <radialGradient id="emeraldAura" cx="50%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <!-- Stylized Glass Solar Panel Surface -->
    <linearGradient id="solarGlass" x1="200" y1="240" x2="824" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#115e59" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="solarCellLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.18" />
    </linearGradient>

    <!-- Luminous Energy Wave Gradient -->
    <linearGradient id="energyWaveStroke" x1="140" y1="540" x2="884" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="energyWaveFill" x1="512" y1="360" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.48" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <!-- Lightning Bolt Gradient (Crisp White-Mint to Sun-Gold/Emerald) -->
    <linearGradient id="boltFill" x1="410" y1="200" x2="620" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#ecfdf5" />
      <stop offset="62%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="boltRim" x1="400" y1="190" x2="640" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#011114" flood-opacity="0.72" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#14b8a6" flood-opacity="0.28" />
    </filter>

    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#022c22" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#2dd4bf" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Base Squircle (Full-bleed safe for maskable + rounded iOS/Android squircle) -->
  <rect width="1024" height="1024" rx="232" fill="url(#liquidBg)" />
  <rect x="28" y="28" width="968" height="968" rx="212" stroke="url(#glassRim)" stroke-width="10" />

  <!-- Ambient Liquid Orbs -->
  <circle cx="512" cy="512" r="410" fill="url(#emeraldAura)" />
  <circle cx="260" cy="240" r="190" fill="#2dd4bf" fill-opacity="0.16" />
  <circle cx="790" cy="780" r="220" fill="#10b981" fill-opacity="0.18" />

  <!-- Top Liquid-Glass Specular Crown -->
  <path d="M 36 260 C 36 130, 130 36, 260 36 L 764 36 C 894 36, 988 130, 988 260 C 988 330, 740 420, 512 420 C 284 420, 36 330, 36 260 Z" fill="url(#topGlassSheen)" />

  <!-- 2. Stylized Perspective Glass Solar Panel (3x3 Monocrystalline Matrix) -->
  <g filter="url(#panelShadow)">
    <!-- Outer Glass Panel Frame -->
    <path d="M 252 248 L 772 248 C 804 248, 828 270, 836 302 L 884 724 C 890 766, 858 804, 814 804 L 210 804 C 166 804, 134 766, 140 724 L 188 302 C 196 270, 220 248, 252 248 Z"
          fill="url(#solarGlass)" stroke="url(#glassRim)" stroke-width="8" stroke-linejoin="round" />

    <!-- Inner Glass Bevel -->
    <path d="M 268 274 L 756 274 L 848 772 L 176 772 Z"
          fill="url(#solarCellLight)" stroke="#5eead4" stroke-opacity="0.3" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Solar Cell Grid Lines (Horizontal Perspective) -->
    <line x1="208" y1="422" x2="816" y2="422" stroke="#99f6e4" stroke-opacity="0.38" stroke-width="4.5" />
    <line x1="192" y1="590" x2="832" y2="590" stroke="#99f6e4" stroke-opacity="0.38" stroke-width="4.5" />

    <!-- Solar Cell Grid Lines (Vertical Perspective) -->
    <line x1="430" y1="274" x2="396" y2="772" stroke="#99f6e4" stroke-opacity="0.38" stroke-width="4.5" />
    <line x1="594" y1="274" x2="628" y2="772" stroke="#99f6e4" stroke-opacity="0.38" stroke-width="4.5" />

    <!-- Cell Busbar Micro-Nodes -->
    <circle cx="419" cy="422" r="7" fill="#99f6e4" fill-opacity="0.85" />
    <circle cx="605" cy="422" r="7" fill="#99f6e4" fill-opacity="0.85" />
    <circle cx="408" cy="590" r="7" fill="#99f6e4" fill-opacity="0.85" />
    <circle cx="616" cy="590" r="7" fill="#99f6e4" fill-opacity="0.85" />
  </g>

  <!-- 3. Luminous Turquoise/Emerald Energy Wave (Intraday Solar Curve) -->
  <g>
    <!-- Soft Area Fill Under Energy Wave -->
    <path d="M 152 648 C 250 648, 295 450, 412 468 C 520 484, 575 604, 676 508 C 756 432, 804 358, 872 370 L 854 776 L 170 776 Z"
          fill="url(#energyWaveFill)" />

    <!-- Glowing Energy Wave Curve -->
    <path filter="url(#waveGlow)"
          d="M 146 648 C 250 648, 295 442, 412 464 C 520 484, 575 606, 676 504 C 756 426, 804 354, 878 368"
          stroke="url(#energyWaveStroke)" stroke-width="20" stroke-linecap="round" fill="none" />
    <path d="M 146 648 C 250 648, 295 442, 412 464 C 520 484, 575 606, 676 504 C 756 426, 804 354, 878 368"
          stroke="#ecfdf5" stroke-width="6" stroke-opacity="0.85" stroke-linecap="round" fill="none" />
  </g>

  <!-- 4. Iconic Liquid-Glass Lightning Bolt (Center Focal Point) -->
  <g filter="url(#boltGlow)">
    <path d="M 566 156 L 348 518 L 498 518 L 446 856 L 692 468 L 534 468 L 566 156 Z"
          fill="url(#boltFill)" stroke="url(#boltRim)" stroke-width="10" stroke-linejoin="round" />
    <!-- Inner Specular Facet on Bolt -->
    <path d="M 550 202 L 382 496 L 498 496 L 518 370 Z"
          fill="#ffffff" fill-opacity="0.45" />
  </g>

  <!-- 5. Radiant Sun/Energy Halo Node at Top Right -->
  <g>
    <circle cx="764" cy="218" r="46" fill="#fde047" fill-opacity="0.22" />
    <circle cx="764" cy="218" r="24" fill="#fef08a" stroke="#ffffff" stroke-width="5" />
  </g>
</svg>